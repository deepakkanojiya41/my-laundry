  <div class="seg">
    <button class="${quick ? 'on' : ''}" data-act="neMode" data-v="quick">Quick</button>
    <button class="${!quick ? 'on' : ''}" data-act="neMode" data-v="detailed">Detailed</button>
  </div>
  ${quick ? `
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div class="field"><label class="label">Clothes count</label><input class="input" id="neCount" inputmode="numeric" data-ne="quickCount" value="${esc(NE.quickCount)}" placeholder="0"></div>
      <div class="field"><label class="label">Rate per piece</label><input class="input" id="neRate" inputmode="decimal" data-ne="quickRate" value="${esc(NE.quickRate)}"></div>
    </div>
    <div class="field"><label class="label">Service</label><div class="chips">${SERVICES.map(s => `<button class="chip ${NE.svc === s ? 'on' : ''}" data-act="neSvc" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
    <div class="receipt" style="margin-bottom:14px">${rrow('Clothes', (NE.quickCount || 0) + ' pcs')}${rrow('Amount', money((Number(NE.quickCount) || 0) * (Number(NE.quickRate) || 0)))}</div>
  ` : `
    <div class="field"><label class="label">Service for new items</label>
      <div class="chips">${SERVICES.map(s => `<button class="chip ${NE.svc === s ? 'on' : ''}" data-act="neSvc" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
    <div class="field"><label class="label">Tap to add items</label>
      <div class="chips">${rateOpts.map(r => `<button class="chip" data-act="neAddItem" data-name="${esc(r.name)}">${esc(r.name)} <span class="cnt">${money(r.price[NE.svc] || 0)}</span></button>`).join('')}
      <button class="chip" data-act="neAddItem" data-name="">Other</button></div></div>
    <div id="neItems">${NE.items.map((it, i) => neItemHTML(it, i)).join('')}</div>
    <button class="btn ghost sm" data-act="neAddBlank" style="margin-bottom:14px">${ic('plus')} Add line</button>
  `}
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <div class="field"><label class="label">Received on</label><input class="input" type="date" id="neRec" data-ne="received" value="${NE.received}"></div>
    <div class="field"><label class="label">Delivery date</label><input class="input" type="date" id="neDue" data-ne="due" value="${NE.due}"></div>
  </div>
  <div class="field"><label class="label">Status</label><div class="chips">${STATUSES.map(s => `<button class="chip ${NE.status === s ? 'on' : ''}" data-act="neStatus" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
  <div class="field"><label class="label">Notes</label><input class="input" data-ne="note" value="${esc(NE.note)}" placeholder="Optional"></div>
  <div class="field"><label class="label">Advance / paid now</label>
    <div style="display:flex;gap:8px"><input class="input" inputmode="decimal" data-ne="paid" value="${esc(NE.paid)}" placeholder="0" style="flex:1">
    <button class="btn sm ghost" data-act="nePaidFull">Paid in full</button></div></div>`;
}
function neItemHTML(it, i) {
  return `<div class="lineitem" data-line="${i}">
    <div class="lname"><input class="input" data-nei="${i}:name" value="${esc(it.name)}" placeholder="Item name" style="height:42px">
      <button class="rm" data-act="neRmItem" data-i="${i}" aria-label="Remove">×</button></div>
    <div class="sub2">
      <select class="input" data-nei="${i}:svc" style="height:42px">${SERVICES.map(s => `<option ${it.svc === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
      <div class="qty"><button data-act="neQty" data-i="${i}" data-d="-1">−</button><span>${it.qty}</span><button data-act="neQty" data-i="${i}" data-d="1">+</button></div>
      <input class="input" inputmode="decimal" data-nei="${i}:price" value="${esc(it.price)}" style="height:42px">
    </div>
    <div class="lt" style="grid-column:1/-1">${money((Number(it.qty) || 0) * (Number(it.price) || 0))}</div>
  </div>`;
}
function neTotals() {
  const t = $('#neTotal');
  if (!t) return;
  let total = 0;
  if (NE.mode === 'quick') total = (Number(NE.quickCount) || 0) * (Number(NE.quickRate) || 0);
  else total = sum(NE.items, i => (Number(i.qty) || 0) * (Number(i.price) || 0));
  t.textContent = money(total);
  $$('[data-line]').forEach(el => {
    const i = +el.dataset.line; const it = NE.items[i]; if (!it) return;
    const lt = $('.lt', el); if (lt) lt.textContent = money((Number(it.qty) || 0) * (Number(it.price) || 0));
  });
}
function neRefresh() {
  const b = $('#neBody'); if (b) b.innerHTML = neHTML();
  neTotals();
}
function neSave() {
  if (!NE.cid) return toast('Select a customer first');
  let items;
  if (NE.mode === 'quick') {
    const count = Number(NE.quickCount) || 0;
    if (count <= 0) return toast('Enter how many clothes');
    items = [{ name: 'Clothes', qty: count, price: Number(NE.quickRate) || 0, svc: NE.svc }];
  } else {
    items = NE.items.filter(i => i.name.trim() && Number(i.qty) > 0).map(i => ({ name: i.name.trim(), qty: Number(i.qty), price: Number(i.price) || 0, svc: i.svc || NE.svc }));
    if (!items.length) return toast('Add at least one item');
  }
  if (!NE.due) return toast('Set a delivery date');
  const total = sum(items, i => i.qty * i.price);
  const clothes = sum(items, i => i.qty);
  const recent = liveEntries().filter(e => e.customerId === NE.cid && clothesOf(e) === clothes && entryTotal(e) === total && dayDiff(todayISO(), e.created) === 0);
  const doSave = () => {
    const paid = Math.min(Number(NE.paid) || 0, total);
    const e = {
      id: uid(), no: nextEntryNo(NE.received), customerId: NE.cid,
      customerEmail: ((custById(NE.cid) || {}).email || '').toLowerCase(),
      service: items.every(i => i.svc === items[0].svc) ? items[0].svc : 'Mixed',
      items, status: NE.status, note: NE.note || '', due: NE.due, created: NE.received,
      payments: paid > 0 ? [{ amount: paid, date: todayISO() }] : [], deleted: false, deletedAt: null
    };
    DB.entries.push(e);
    if (NE.received !== todayISO()) renumberAll();
    persist('entry', e.id);
    const btn = $('#neSave'); if (btn) { btn.disabled = true; }
    requestClose();
    setTimeout(() => {
      const c = custById(e.customerId) || { name: 'customer', phone: '' };
      toast('Entry ' + String(e.no).padStart(2, '0') + ' saved');
      snack('Send the entry receipt to ' + (c.name.split(' ')[0]) + '?', 'WhatsApp', () => {
        const ctx = customerCtx(c, { clothesCount: String(clothes), totalClothes: money(total), rate: money(items[0].price) });
        openWa(c.phone, renderTemplate('daily', ctx));
      });
      render();
    }, 90);
  };
  if (recent.length) {
    confirmSheet({ title: 'Looks like a repeat', msg: 'The same customer, clothes count and amount were saved in the last few hours. Save anyway?', label: 'Save anyway', onOk: doSave });
  } else doSave();
}

  const mixed = new Set(e.items.map(i => i.svc || e.service)).size > 1;
  const body = `
    <div class="receipt" style="margin-bottom:12px">
      ${rrow('Entry', 'No ' + String(e.no).padStart(2, '0') + ' · ' + fmtD(e.created))}
      ${rrow('Customer', c.name)}
      ${rrow('Service', e.service)}
      ${rrow('Delivery', fmtD(e.due))}
    </div>
    <button class="card tap" data-act="entryStatus" data-id="${e.id}" style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-bottom:12px">
      <div class="grow"><div class="tiny">Status</div><div style="margin-top:4px">${statusPill(isOverdue(e) ? 'Overdue' : e.status)}</div></div>
      <div class="tiny">Tap to change status</div>${ic('chevR', 16)}
    </button>
    <div class="sec-title" style="margin-top:4px"><div class="h2">Items</div></div>
    <div class="receipt">
      ${e.items.map(i => rrow((mixed ? i.name + ' · ' + (i.svc || e.service) : i.name) + ' × ' + i.qty, money(i.qty * i.price))).join('')}
      ${rrow('Total', money(entryTotal(e)), 'total')}
      ${rrow('Paid', money(entryPaid(e)), 'ok')}
      ${rrow('Balance', money(bal), bal > 0 ? 'due' : 'ok')}
    </div>
    ${e.note ? `<div class="notice">${ic('edit', 15)}<div>${esc(e.note)}</div></div>` : ''}
    ${e.payments.length ? `<div class="sec-title"><div class="h2">Payments</div></div><div class="paidlist">${e.payments.map((p, i) => `<div class="pr"><span>${money(p.amount)} · ${esc(fmtD(p.date, 'short'))}</span><button class="linkbtn" data-act="rmPayment" data-id="${e.id}" data-i="${i}" style="color:var(--due)">Remove</button></div>`).join('')}</div>` : ''}

      <div style="display:flex;gap:8px"><input class="input" id="payAmt" inputmode="decimal" placeholder="${Math.round(bal)}" style="flex:1">

  openSheet({
    title: 'Entry ' + String(e.no).padStart(2, '0'),
    sub: fmtD(e.created) + ' · ' + c.name,
    body,
    foot: `<button class="btn ghost" data-act="editEntry" data-id="${e.id}">Edit</button>
      <button class="btn" data-act="entrySend" data-id="${e.id}">Send</button>
      <button class="btn danger" data-act="delEntry" data-id="${e.id}" style="flex:0 0 56px;padding:0">${ic('trash')}</button>`
  });
}

/* ---------- payments ---------- */
function openCollect(cid) {
  const c = custById(cid); if (!c) return;
  const t = custTotals(cid);
  openSheet({
    title: 'Collect payment',
    sub: c.name + ' · due ' + money(t.balance),
    body: `<div class="field"><label class="label">Amount received</label><input class="input" id="colAmt" inputmode="decimal" placeholder="0" autofocus></div>
      <button class="btn ghost sm" data-act="colFull" data-v="${t.balance}">Full due (${money(t.balance)})</button>
      <div class="hint" style="margin-top:10px">Applies to the oldest unpaid entries first.</div>`,
    foot: `<button class="btn ghost" data-x3>Cancel</button><button class="btn primary" id="colSave">Record payment</button>`,
    onMount: w => {
      $('[data-x3]', w).addEventListener('click', () => requestClose());
      $('[data-act="colFull"]', w).addEventListener('click', () => { $('#colAmt', w).value = t.balance; });
      $('#colSave', w).addEventListener('click', () => {
        const amt = Math.round(Number($('#colAmt', w).value) || 0);
        if (amt <= 0) return toast('Enter an amount');
        if (amt > t.balance) return toast('Cannot exceed ' + money(t.balance));
        collectForCustomer(cid, amt);
        requestClose();
        setTimeout(() => { toast('Payment of ' + money(amt) + ' recorded'); render(); }, 80);
      });
    }
  });
}

/* ---------- UPI ---------- */
function openUpi(cid) {
  const c = custById(cid);
  const due = c ? custTotals(cid).balance : overallDues();
  if (!DB.shop.upi) {
    return confirmSheet({ title: 'No UPI ID yet', msg: 'Add your business UPI ID in the shop profile to collect by UPI.', label: 'Open shop profile', onOk: () => openShopProfile() });
  }
  openSheet({
    title: c ? 'Collect by UPI' : 'Pay via UPI',
    sub: c ? c.name : DB.shop.name,
    body: `<div class="field"><label class="label">Amount</label>
        <div style="display:flex;gap:8px"><input class="input" id="upiAmt" inputmode="decimal" value="${due > 0 ? due : ''}" placeholder="0" style="flex:1">
        ${due > 0 ? `<button class="btn sm ghost" data-act="upiFull" data-v="${due}">Full due</button>` : ''}</div></div>
      <div id="upiQR" class="qrbox">${qrSVG(upiLink(due || 0, 'Laundry payment'), 220)}</div>
      <div class="tiny center" style="margin-bottom:12px">${esc(DB.shop.upi)}</div>
      ${UI.mode === 'cust' ? `
      <div class="btnrow" style="margin-bottom:8px">
        <button class="btn sm primary" data-act="upiOpen">Open UPI app</button>
        <button class="btn sm ghost" data-act="upiCopy">Copy UPI link</button>
      </div>
      <div class="chips" style="margin-top:10px">
        ${[['gpay', 'Google Pay'], ['phonepe', 'PhonePe'], ['paytm', 'Paytm']].map(([k, l]) => `<button class="chip" data-act="upiApp" data-app="${k}">${l}</button>`).join('')}

/* ---------- message sheet ---------- */
function openMessageSheet(cid) {
  const c = custById(cid); if (!c) return;
  const keys = Object.keys(TPL_NAMES);
  openSheet({
    title: 'Send message',
    sub: c.name,
    body: `<div class="chips wrap" style="margin-bottom:12px">${keys.map((k, i) => `<button class="chip ${i === 0 ? 'on' : ''}" data-msg="${k}">${esc(TPL_NAMES[k])}</button>`).join('')}</div>
      <div class="tmpl-prev" id="msgPrev"></div>`,
    foot: `<button class="btn ghost" data-act="msgCopy">Copy</button><button class="btn primary" data-act="msgOpen" data-cid="${cid}">Open WhatsApp</button>`,
    onMount: w => {
      let cur = keys[0];
      const draw = () => {
        const t = custTotals(cid);
        const ctx = customerCtx(c, { totalClothes: String(t.clothes), clothesCount: '3', rate: money(DB.rates[0] ? DB.rates[0].price['Ironing'] : 10) });
        $('#msgPrev', w).textContent = renderTemplate(cur, ctx);
      };
      draw();
      $$('[data-msg]', w).forEach(b => b.addEventListener('click', () => {
        cur = b.dataset.msg;
        $$('[data-msg]', w).forEach(x => x.classList.toggle('on', x === b));
        draw();
      }));
      w.dataset.tpl = '1';
      w._cur = () => cur;
      $('[data-act="msgOpen"]', w).addEventListener('click', () => {
        openWa(c.phone, $('#msgPrev', w).textContent);
      });
      $('[data-act="msgCopy"]', w).addEventListener('click', () => {
        copyText($('#msgPrev', w).textContent);
      });
    }
  });
}
function copyText(txt) {
  if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Copied'), () => toast('Could not copy'));
  else toast('Copy not available');
}

/* ---------- shop profile ---------- */
function openShopProfile() {
  const s = DB.shop;
  openSheet({
    title: 'Shop profile',
    body: `<div class="field"><label class="label">Shop name</label><input class="input" id="sp-name" value="${esc(s.name)}"></div>
      <div class="field"><label class="label">Tagline</label><input class="input" id="sp-tag" value="${esc(s.tagline)}"></div>
      <div class="field"><label class="label">Shop mobile</label><div class="prefix"><span>+91</span><input id="sp-phone" inputmode="numeric" maxlength="10" value="${esc(s.phone)}"></div></div>
      <div class="field"><label class="label">Address</label><textarea class="input" id="sp-addr">${esc(s.address)}</textarea></div>
      <div class="field"><label class="label">Business UPI ID</label><input class="input" id="sp-upi" value="${esc(s.upi)}" placeholder="shop@bank"><div class="hint">Format: name@handle</div></div>
      <div class="field"><label class="label">Web address of this app</label><input class="input" id="sp-web" value="${esc(s.webUrl)}" placeholder="https://…"><div class="hint">Used to build customer passbook links. Leave blank to use this app's own address.</div></div>
      <div class="field"><label class="label">Owner name (greeting)</label><input class="input" id="sp-owner" value="${esc(s.owner)}"></div>
      <div id="sp-err" class="err" style="display:none"></div>`,
    foot: `<button class="btn primary" id="sp-save">Save profile</button>`,
    onMount: w => {
      $('#sp-save', w).addEventListener('click', () => {
        const err = $('#sp-err', w); err.style.display = 'none';
        const upi = $('#sp-upi', w).value.trim();
        if (upi && !validUpi(upi)) { err.textContent = 'UPI ID should look like name@handle.'; err.style.display = 'block'; return; }

/* ---------- backup / restore / reset ---------- */
function doBackup() {
  const data = { v: 1, exported: new Date().toISOString(), shop: DB.shop, customers: DB.customers, entries: DB.entries, requests: DB.requests, rates: DB.rates, templates: DB.templates };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'my-laundry-backup-' + todayISO() + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('Backup downloaded');
}
function openRestore() {
  openSheet({
    title: 'Backup and restore',
    body: `<button class="btn primary" data-act="backupNow" style="margin-bottom:10px">${ic('download')} Export all data</button>
      <label class="btn ghost">${ic('upload')} Import a backup<input type="file" id="rsFile" accept="application/json" hidden></label>
      <div class="hint" style="margin-top:10px">Importing adds or updates records. Nothing is deleted.</div>`,
    onMount: w => {
      $('[data-act="backupNow"]', w).addEventListener('click', () => { doBackup(); });
      $('#rsFile', w).addEventListener('change', ev => {
        const f = ev.target.files[0]; if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          let d;
          try { d = JSON.parse(r.result); } catch (e) { return toast('That file is not a valid backup'); }
          if (!d || !Array.isArray(d.customers)) return toast('That file is not a valid backup');
          confirmSheet({
            title: 'Import backup?', msg: 'Records in the file are added or updated. Nothing is deleted.', label: 'Import',
            onOk: () => {
              d.customers.forEach(c => { const ex = DB.customers.find(x => x.id === c.id); if (ex) Object.assign(ex, c); else DB.customers.push(c); });
              (d.entries || []).forEach(e => { const ex = DB.entries.find(x => x.id === e.id); if (ex) Object.assign(ex, e); else DB.entries.push(e); });
              (d.requests || []).forEach(q => { if (!DB.requests.find(x => x.id === q.id)) DB.requests.push(q); });
              if (d.rates && d.rates.length) DB.rates = d.rates;
              if (d.templates) DB.templates = Object.assign(defaultTemplates(), d.templates);
              if (d.shop) DB.shop = Object.assign(defaultShop(), d.shop);
              renumberAll(); persist('all');
              render(); toast('Backup imported');
            }
          });
        };
        r.readAsText(f);
      });
    }
  });
}
function doReset() {
  confirmSheet({
    title: 'Reset all data?', msg: 'Customers, entries and pickup requests are cleared. Shop profile and rate card are kept.', label: 'Reset', danger: true,
    onOk: () => {
      DB.customers = []; DB.entries = []; DB.requests = []; DB.bin = { customers: [], entries: [] };
      persist('all'); render(); toast('All data cleared');
    }
  });
}

Object.assign(ACTIONS, {
  /* navigation */
  back: () => history.back(),
  tab: t => switchTab(t.dataset.tab),
  goTab: t => switchTab(t.dataset.tab),
  goUdhari: () => go('udhari'),
  goRateCard: () => go('ratecard'),
  goTemplates: () => go('templates'),
  goRecycle: () => go('recycle'),
  openBills: () => { UI.billsMonth = monthKey(todayISO()); go('bills'); },
  openBill: t => go('bill', { cid: t.dataset.cid, month: t.dataset.month || UI.billsMonth || monthKey(todayISO()) }),
  openCustomer: t => { UI.showAllEntries = false; go('customer', { id: t.dataset.id }); },
  showAllEntries: () => { UI.showAllEntries = true; render(); },

  /* customers */
  addCustomer: () => openCustomerForm(null, () => { }),
  editCustomer: t => openCustomerForm(t.dataset.id, () => render()),
  sortCust: t => { UI.sort = t.dataset.v; render(); },
  delCustomer: t => {
    const c = custById(t.dataset.id || t.dataset.cid); if (!c) return;
    confirmSheet({
      title: 'Delete ' + c.name + '?', msg: 'The customer and their entries go to the Recycle bin. You can restore them.', label: 'Delete', danger: true,
      onOk: () => {
        const ids = liveEntries().filter(e => e.customerId === c.id);
        c.deleted = true; c.deletedAt = new Date().toISOString();
        ids.forEach(e => { e.deleted = true; e.deletedAt = c.deletedAt; DB.bin.entries.push(e); });
        DB.bin.customers.push(c);
        persist('customer', c.id);
        const view = $('#view'); view.classList.add('out-right');
        NAVSTACK.length = 0; UI.screen = 'customers'; UI.adminTab = 'customers'; UI.params = {};
        setTimeout(() => { render(); window.scrollTo(0, 0); }, 200);
        snack('Deleted ' + c.name.split(' ')[0] + ' and ' + ids.length + ' entr' + (ids.length === 1 ? 'y' : 'ies'), 'Undo', () => {
          c.deleted = false; c.deletedAt = null;
          DB.bin.customers = DB.bin.customers.filter(x => x.id !== c.id);
          ids.forEach(e => { e.deleted = false; e.deletedAt = null; });
          DB.bin.entries = DB.bin.entries.filter(x => x.customerId !== c.id);
          persist('customer', c.id); render(); toast('Restored');
        }, 8000);
      }
    });
  },

  /* orders */
  ordersSeg: t => { UI.ordersSeg = t.dataset.v; render(); },
  pipeFilter: t => { UI.pipeline = t.dataset.v; render(); },
  dayMove: t => { UI.dayDate = dateAdd(UI.dayDate || todayISO(), +t.dataset.v); render(); },
  dayFilter: t => { UI.dayFilter = t.dataset.v; render(); },
  range: t => { UI.range = t.dataset.v; render(); },
  addRequest: () => openRequestForm(),
  acceptRequest: t => acceptRequest(t.dataset.id),
  rejectRequest: t => {
    const r = DB.requests.find(x => x.id === t.dataset.id); if (!r) return;
    r.status = 'rejected'; persist('request', r.id); render();
    snack('Reply to ' + r.name.split(' ')[0] + '?', 'WhatsApp', () => openWa(r.mobile, `Namaste ${r.name.split(' ')[0]}, sorry we cannot take the pickup on ${fmtD(r.date)} (${r.slot}). Please suggest another day.\n— ${DB.shop.name}`));
  },

  /* entries */
  newEntry: t => openNewEntry(t.dataset.cid || null),
  openEntry: t => openEntry(t.dataset.id),
  openStatus: t => openStatus(t.dataset.id),
  entryStatus: t => openStatus(t.dataset.id),
  setStatus: t => {
    const e = entryById(t.dataset.id); if (!e) return;
    const from = e.status; e.status = t.dataset.v; persist('entry', e.id);
    const backToDetail = sheets.length > 1;
    requestClose();
    setTimeout(() => { render(); if (!backToDetail) openEntry(e.id); }, 110);
    if (from !== e.status && ['Processing', 'Ready', 'Out for delivery', 'Delivered', 'Cancelled', 'Rejected'].includes(e.status)) {
      const c = custById(e.customerId);
      snack('Entry ' + String(e.no).padStart(2, '0') + ' is ' + e.status.toLowerCase() + '. Message ' + (c ? c.name.split(' ')[0] : 'customer') + '?', 'WhatsApp', () => {
        openWa(c && c.phone, `Namaste ${c ? c.name.split(' ')[0] : ''}, update on entry ${String(e.no).padStart(2, '0')}: ${e.status.toLowerCase()}.\n— ${DB.shop.name}`);
      });
    }
  },
  nextStep: t => {
    const e = entryById(t.dataset.id); if (!e) return;
    const nxt = NEXT_STATUS[e.status]; if (!nxt) return;
    e.status = nxt; persist('entry', e.id); render();
    const c = custById(e.customerId);
    toast('Entry ' + String(e.no).padStart(2, '0') + ' · ' + nxt);
    snack('Send ' + nxt.toLowerCase() + ' update to ' + (c ? c.name.split(' ')[0] : '') + '?', 'WhatsApp', () => {
      openWa(c && c.phone, `Namaste ${c ? c.name.split(' ')[0] : ''}, entry ${String(e.no).padStart(2, '0')} is now ${nxt.toLowerCase()}.\n— ${DB.shop.name}`);
    });
  },
  editEntry: t => openEditEntry(t.dataset.id),
  entrySend: t => {
    const e = entryById(t.dataset.id), c = custById(e.customerId);
    openMessageSheet(c.id);
  },
  delEntry: t => {
    const e = entryById(t.dataset.id); if (!e) return;
    confirmSheet({
      title: 'Delete entry ' + String(e.no).padStart(2, '0') + '?', msg: 'The entry moves to the Recycle bin.', label: 'Delete', danger: true,
      onOk: () => {
        e.deleted = true; e.deletedAt = new Date().toISOString(); DB.bin.entries.push(e);
        persist('entry', e.id);
        if (sheets.length) requestClose();          /* the sheet was showing the entry we just deleted */
        render();
        snack('Entry deleted', 'Undo', () => { e.deleted = false; e.deletedAt = null; DB.bin.entries = DB.bin.entries.filter(x => x.id !== e.id); persist('entry', e.id); render(); });
      }
    });
  },
  rmPayment: t => {
    const e = entryById(t.dataset.id); if (!e) return;
    const p = e.payments[+t.dataset.i]; if (!p) return;
    confirmSheet({ title: 'Remove payment?', msg: 'This removes ' + money(p.amount) + ' recorded on ' + fmtD(p.date) + '.', label: 'Remove', danger: true, onOk: () => { e.payments.splice(+t.dataset.i, 1); persist('entry', e.id); render(); openEntry(e.id); } });
  },
  payEntry: t => {
    const e = entryById(t.dataset.id); if (!e) return;
    const el = $('#payAmt'); const amt = Math.round(Number(el ? el.value : 0) || 0);
    if (amt <= 0) return toast('Enter an amount');
    if (amt > entryBal(e)) return toast('Cannot exceed ' + money(entryBal(e)));
    applyPayment(e, amt);
    render(); toast(money(amt) + ' recorded');
    setTimeout(() => openEntry(e.id), 60);
  },

  /* new entry sheet */
  nePick: () => openCustomerPicker(cid => { NE.cid = cid; neRefresh(); }),
  neMode: t => { UI.entryMode = t.dataset.v; NE.mode = t.dataset.v; neRefresh(); },
  neSvc: t => {
    const old = NE.svc; NE.svc = t.dataset.v;
    NE.items.forEach(i => { if (i.autoPrice !== false) { const r = DB.rates.find(x => x.name === i.name); if (r) i.price = r.price[NE.svc] || i.price; } });
    neRefresh();
  },
  neAddItem: t => {
    const name = t.dataset.name;
    const r = DB.rates.find(x => x.name === name);
    const price = r ? (r.price[NE.svc] || 0) : 0;
    const ex = NE.items.find(i => i.name === name && !name === false);
    if (name && ex) { ex.qty = (Number(ex.qty) || 0) + 1; }
    else {
      const blank = NE.items.find(i => !i.name);
      if (blank) { blank.name = name; blank.price = price; blank.svc = NE.svc; blank.qty = 1; }
      else NE.items.push({ name: name || '', qty: 1, price, svc: NE.svc });
    }
    neRefresh();
  },
  neAddBlank: () => { NE.items.push({ name: '', qty: 1, price: 0, svc: NE.svc }); neRefresh(); },
  neRmItem: t => { NE.items.splice(+t.dataset.i, 1); if (!NE.items.length) NE.items.push({ name: '', qty: 1, price: 0, svc: NE.svc }); neRefresh(); },
  neQty: t => {
    const i = +t.dataset.i, d = +t.dataset.d; const it = NE.items[i]; if (!it) return;
    const q = (Number(it.qty) || 0) + d;
    if (q <= 0) { NE.items.splice(i, 1); if (!NE.items.length) NE.items.push({ name: '', qty: 1, price: 0, svc: NE.svc }); }
    else it.qty = q;
    neRefresh();
  },
  neStatus: t => { NE.status = t.dataset.v; neRefresh(); },
  nePaidFull: () => {
    let total = NE.mode === 'quick' ? (Number(NE.quickCount) || 0) * (Number(NE.quickRate) || 0) : sum(NE.items, i => (Number(i.qty) || 0) * (Number(i.price) || 0));
    NE.paid = String(total); neRefresh();
  },
  pickerAdd: () => { },

  /* payments & money */
  collect: t => openCollect(t.dataset.cid),
  colFull: t => { const el = $('#colAmt'); if (el) el.value = t.dataset.v; },
  upiSheet: t => openUpi(t.dataset.cid),
  upiFull: t => { const el = $('#upiAmt'); if (el) el.value = t.dataset.v; $('#upiQR').innerHTML = qrSVG(upiLink(+t.dataset.v, 'Laundry payment'), 220); },
  upiOpen: () => { const a = document.createElement('a'); a.href = upiLink(Number(($('#upiAmt') || {}).value) || 0, 'Laundry payment'); a.click(); },
  upiCopy: () => copyText(upiLink(Number(($('#upiAmt') || {}).value) || 0, 'Laundry payment')),
  upiApp: t => {
    const amt = Number(($('#upiAmt') || {}).value) || 0;
    const link = upiLink(amt, 'Laundry payment');
    const map = { gpay: 'tez://upi/pay?', phonepe: 'phonepe://pay?', paytm: 'paytmmp://pay?' };
    const q = link.split('?')[1] || '';
    const a = document.createElement('a'); a.href = (map[t.dataset.app] || '') + q; a.click();
    toast('Opening ' + (t.dataset.app === 'gpay' ? 'Google Pay' : t.dataset.app === 'phonepe' ? 'PhonePe' : 'Paytm'));
  },
  remind: t => {
    const c = custById(t.dataset.cid);
    openWa(c.phone, renderTemplate('due', customerCtx(c, { balance: money(custTotals(c.id).balance) })));
  },

  /* messages */
  msgSheet: t => openMessageSheet(t.dataset.cid),
  msgCopy: () => { const p = $('#msgPrev'); if (p) copyText(p.textContent); },
  msgOpen: t => { const p = $('#msgPrev'); const c = custById(t.dataset.cid); if (p && c) openWa(c.phone, p.textContent); },

  /* calls & maps */
  call: t => { location.href = 'tel:+91' + normPhone(t.dataset.phone); },
  chat: t => {
    const c = custById(t.dataset.cid); if (!c) return;
    openWa(c.phone, `Namaste ${c.name.split(' ')[0]}, this is ${DB.shop.name}.`);
  },
  directions: t => {
    const c = custById(t.dataset.cid); if (!c) return;
    window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.address || c.name), '_blank', 'noopener');
  },

  /* settings */

          <input class="input" data-edi="${i}:qty" inputmode="numeric" value="${esc(it.qty)}" style="height:42px">
          <input class="input" data-edi="${i}:price" inputmode="decimal" value="${esc(it.price)}" style="height:42px">
          <button class="rm" data-edrm="${i}" aria-label="Remove">×</button></div>`).join('');
        $$('[data-edi]', w).forEach(inp => inp.addEventListener('input', () => {

      $('#ed-save', w).addEventListener('click', () => {
        const clean = items.filter(i => i.name.trim() && Number(i.qty) > 0);
        if (!clean.length) return toast('Keep at least one item');
        e.items = clean.map(i => ({ name: i.name.trim(), qty: Number(i.qty), price: Number(i.price) || 0, svc: i.svc || e.service }));
        e.created = $('#ed-rec', w).value || e.created;
        e.due = $('#ed-due', w).value || e.due;
        e.note = $('#ed-note', w).value;
        e.status = status;
        e.service = new Set(e.items.map(i => i.svc)).size > 1 ? 'Mixed' : e.items[0].svc;
        renumberAll(); persist('entry', e.id);
        requestClose(); setTimeout(() => { render(); toast('Entry updated'); }, 90);
      });
    }
  });
}

/* ---------- deep links (#p= passbook, #r= pickup request) ---------- */
function handleHash() {
  const h = location.hash || '';
  if (h.startsWith('#p=')) {
    try {
      const data = JSON.parse(LZString.decompressFromEncodedURIComponent(h.slice(3)));
      if (data && data.c) {
        const c = custById(data.c) || liveCustomers().find(x => x.name === data.n) || liveCustomers()[0];
        if (c) {
          DB.session = { type: 'customer', email: (c.email || ''), customerId: c.id };
          UI.mode = 'cust'; UI.preview = false; UI.screen = 'entries'; UI.custTab = 'entries'; UI.params = { cid: c.id };
          render(); return true;
        }
      }
    } catch (e) { UI.screen = 'linkerror'; render(); return true; }
    UI.screen = 'linkerror'; render(); return true;
  }
  if (h.startsWith('#r=')) {
    try {
      const data = JSON.parse(LZString.decompressFromEncodedURIComponent(h.slice(3)));
      UI.mode = 'admin'; UI.screen = 'orders'; UI.adminTab = 'orders'; UI.ordersSeg = 'requests'; UI.params = {};
      render();
      setTimeout(() => openRequestForm(data || {}), 350);
      return true;
    } catch (e) { UI.screen = 'linkerror'; render(); return true; }
  }
  return false;
}

/* ---------- boot ---------- */
function waitForGoogle(ms) {
  return new Promise(resolve => {
    if (window.FBGoogle) return resolve(true);
    const t = setTimeout(() => resolve(!!window.FBGoogle), ms);
    window.addEventListener('fb-google-ready', () => { clearTimeout(t); resolve(true); }, { once: true });
  });
}
function sessionFor(email, uid) {
  const e = (email || '').toLowerCase();
  const admin = (DB.shop.ownerEmail || ADMIN_EMAIL_FALLBACK).toLowerCase();
  if (e && e === admin) return { type: 'admin', email: e, uid };
  const c = liveCustomers().find(x => x.email && x.email.toLowerCase() === e);
  if (c) return { type: 'customer', email: e, uid, customerId: c.id };
  return null;
}
function enterSession() {
  const s = DB.session;
  NAVSTACK.length = 0; UI.params = {};
  pendingAnim = true; UI.dir = 1;
  if (s.type === 'admin') { UI.mode = 'admin'; UI.screen = 'home'; UI.adminTab = 'home'; }
  else { UI.mode = 'cust'; UI.preview = false; UI.screen = 'entries'; UI.custTab = 'entries'; UI.params = { cid: s.customerId }; }
  render(); window.scrollTo(0, 0);
}
function cachedSession() {
  try {
    const raw = localStorage.getItem('ml_session');
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveSession(s) {
  try { s ? localStorage.setItem('ml_session', JSON.stringify(s)) : localStorage.removeItem('ml_session'); } catch (e) { }
}
async function boot() {
  const cached = cachedSession();
  if (cached) {
    DB.session = cached;
    FB.restoreLocal();          /* instant paint from the last known data */
    enterSession();
  }
  else { UI.screen = 'splash'; render(); }
  await waitForGoogle(3000);
  let user = null;
  let authKnown = false;
  if (window.FBGoogle) {
    try {
      const r = window.FBGoogle.firstAuth ? await window.FBGoogle.firstAuth(6000) : await window.FBGoogle.current();
      if (r === 'timeout') { authKnown = false; }
      else { user = r; authKnown = true; }
    } catch (e) { }
  }
  const hadRemote = await FB.init();
  if (user) {
    const s = sessionFor(user.email, user.uid);
    if (s) DB.session = s;
  }
  if (hadRemote) { closeAllSheets(); }
  /* only drop a cached session when firebase has actually told us nobody is signed in */
  if (authKnown && !user && DB.session && DB.session.uid) {
    DB.session = null; saveSession(null);
  }
  if (user && !DB.session) {
    const s2 = sessionFor(user.email, user.uid);
    if (s2) { DB.session = s2; saveSession(s2); }
    else if (!handleHash()) {
      UI.mode = 'cust'; UI.screen = 'onboard';
      UI.params = { email: user.email, uid: user.uid, name: user.name || '' };
      render(); window.scrollTo(0, 0);
      return;
    }
  }
  if (handleHash()) { /* deep link wins */ }
  else if (DB.session) {
    saveSession(DB.session);
    if (UI.screen === 'splash') enterSession(); else render();
  } else if (UI.screen === 'splash') {
    UI.screen = 'signin'; UI.mode = 'admin'; render();
  } else {
    render();                       /* the user already navigated: do not reset their screen */
  }
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update().catch(() => { });
    }).catch(() => { });
  }
  /* keep the status bar colour in step with the theme */
  /* status bar navy while the hero is on screen, white once you scroll into the page */
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    try {
      const dark = window.matchMedia('(prefers-color-scheme: dark)');
      const paint = () => {
        meta.setAttribute('content', dark.matches ? '#9CC3FA' : '#122C63');   /* navy, always */
      };
      paint();
      if (dark.addEventListener) dark.addEventListener('change', paint);
    } catch (e) { }
  }
}
document.addEventListener('DOMContentLoaded', boot);
if (document.readyState !== 'loading') boot();

</script>
<script type="module">
/* ---- real Google sign-in through Firebase Auth ---- */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';

const app = initializeApp(window.FIREBASE_CONFIG);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(() => { });

window.FBGoogle = {
  ready: true,
  async current(force) {
    const u = auth.currentUser;
    if (!u) return null;
    try { window.FB.token = await u.getIdToken(!!force); } catch (e) { }
    return { email: u.email || '', name: u.displayName || '', uid: u.uid };
  },
  firstAuth(timeout) {
    return new Promise(resolve => {
      let done = false;
      const finish = v => { if (!done) { done = true; resolve(v); } };
      const un = onAuthStateChanged(auth, async u => {
        un();
        if (!u) return finish(null);
        try { window.FB.token = await u.getIdToken(); } catch (e) { }
        finish({ email: u.email || '', name: u.displayName || '', uid: u.uid });
      });
      setTimeout(() => finish('timeout'), timeout || 6000);
    });
  },
  onChange(cb) {
    onAuthStateChanged(auth, async u => {
      if (u) { try { window.FB.token = await u.getIdToken(); } catch (e) { } }
      cb(u ? { email: u.email || '', name: u.displayName || '', uid: u.uid } : null);
    });
  },
  async signIn() {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });
    const res = await signInWithPopup(auth, provider);
    const token = await res.user.getIdToken();
    window.FB.token = token;
    return { email: res.user.email || '', name: res.user.displayName || '', uid: res.user.uid };
  },
  async signOut() {
    try { await signOut(auth); } catch (e) { }
    window.FB.token = null;
  }
};
window.dispatchEvent(new Event('fb-google-ready'));
</script>
